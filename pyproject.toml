[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apra-client"
version = "0.1.0"
description = "Fetch and normalise APRA superannuation disclosure data. Returns a pandas DataFrame."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Auchenflower Capital" }]
keywords = ["apra", "superannuation", "australia", "finance", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/alexbrownqld18-lab/apra-client"
"Bug Tracker" = "https://github.com/alexbrownqld18-lab/apra-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/apra_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
